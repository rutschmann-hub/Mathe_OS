<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analysis Mindmap</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap');

  :root {
    --mustard: #d4a845;
    --mustard-strong: #c9982f;
    --gold-soft: #f7e5b6;
    --gold-bg: #fff6e2;
    --navy: #263040;
    --cream: #fffaf0;
    --text: #2d2c28;
    --muted: #6f695a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    padding: 14px;
    font-family: 'M PLUS Rounded 1c', sans-serif;
    color: var(--text);
    background:
      radial-gradient(circle at 18% 22%, rgba(212, 168, 69, 0.28) 0%, rgba(212, 168, 69, 0) 44%),
      radial-gradient(circle at 84% 80%, rgba(212, 168, 69, 0.2) 0%, rgba(212, 168, 69, 0) 40%),
      var(--cream);
  }

  .viewport {
    position: relative;
    margin: 0 auto;
    width: 100%;
    max-width: 1120px;
  }

  .canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 1100px;
    height: 820px;
    transform-origin: top left;
  }

  svg.lines {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .node {
    position: absolute;
    border-radius: 14px;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  }

  .center {
    width: 172px;
    height: 172px;
    border-radius: 50%;
    border: 3px solid var(--mustard-strong);
    font-family: 'M PLUS Rounded 1c', sans-serif;
    font-size: 25px;
    font-weight: 700;
    letter-spacing: 0.6px;
    left: 464px;
    top: 324px;
    color: #2e2510;
    background: radial-gradient(circle at 30% 25%, #ffe9b7 0%, #f1c867 62%, #d8ab46 100%);
    box-shadow: 0 12px 34px rgba(201, 152, 47, 0.35);
    cursor: default;
  }

  .branch {
    width: 210px;
    height: 62px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.1px;
    border: 2px solid #ddb867;
    box-shadow: 0 4px 12px rgba(201, 152, 47, 0.2);
    padding: 0 14px;
    color: #3c3020;
    background: linear-gradient(180deg, #fffef7 0%, var(--gold-soft) 100%);
  }

  .branch:hover,
  .branch.active {
    transform: translateY(-2px) scale(1.04);
    border-color: var(--mustard-strong);
    box-shadow: 0 10px 24px rgba(201, 152, 47, 0.34);
  }

  #b-funk  { left: 48px;  top:  68px; }
  #b-graph { left: 48px;  top: 366px; }
  #b-kurv  { left: 48px;  top: 642px; }
  #b-abl   { left: 842px; top:  68px; }
  #b-int   { left: 842px; top: 366px; }
  #b-gleich{ left: 842px; top: 642px; }

  .panel {
    display: none;
    opacity: 0;
    position: absolute;
    background: var(--gold-bg);
    border: 1.5px solid #e3c177;
    border-radius: 14px;
    padding: 14px 16px;
    font-size: 12.8px;
    font-weight: 500;
    line-height: 1.8;
    white-space: nowrap;
    z-index: 30;
    box-shadow: 0 14px 34px rgba(201, 152, 47, 0.24);
    pointer-events: none;
    transform: translateY(-6px);
    transition: opacity 0.2s ease, transform 0.2s ease;
    color: #3b3327;
  }

  .branch:hover .panel,
  .branch.active .panel {
    display: block;
    opacity: 1;
    transform: translateY(0);
  }

  #b-funk   .panel { left: 220px; top: -8px; }
  #b-graph  .panel { left: 220px; top: -36px; }
  #b-kurv   .panel { left: 220px; top: -168px; }
  #b-abl    .panel { right: 220px; top: -8px; text-align: right; }
  #b-int    .panel { right: 220px; top: -82px; text-align: right; }
  #b-gleich .panel { right: 220px; top: -122px; text-align: right; }

  .panel-title {
    font-weight: 800;
    font-size: 13px;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    color: #8a6516;
    border-bottom: 2px solid #ead4a1;
    margin-bottom: 8px;
    padding-bottom: 6px;
  }

  .hint {
    position: fixed;
    right: 12px;
    bottom: 12px;
    font-size: 0.74rem;
    color: var(--muted);
    background: rgba(255, 248, 230, 0.9);
    border: 1px solid #e8d2a3;
    border-radius: 999px;
    padding: 0.32rem 0.6rem;
  }

  @media (max-width: 768px) {
    body { padding: 8px; }
    .panel { font-size: 12px; line-height: 1.65; }
    .hint { font-size: 0.7rem; }
  }
</style>
</head>
<body>
<div class="viewport" id="viewport">
  <div class="canvas" id="canvas">
    <svg class="lines" id="svg-lines"></svg>

    <div class="node center" id="center">ANALYSIS</div>

    <button class="node branch" id="b-funk" type="button">
      Funktionen
      <div class="panel">
        <div class="panel-title">Funktionen</div>
        ganzrationale Funktionen<br>
        Potenzfunktionen<br>
        Exponentialfunktionen<br>
        trigonometrische Funktionen<br>
        gebrochen-rationale Funktionen<br>
        Logarithmusfunktionen<br>
        Wurzelfunktionen<br>
        Umkehrfunktionen<br>
        Funktionen aufstellen
      </div>
    </button>

    <button class="node branch" id="b-graph" type="button">
      Graphen
      <div class="panel">
        <div class="panel-title">Graphen</div>
        Verschiebung<br>
        Streckung<br>
        Spiegelung<br>
        charakteristische Eigenschaften
      </div>
    </button>

    <button class="node branch" id="b-kurv" type="button">
      Kurven untersuchen
      <div class="panel">
        <div class="panel-title">Kurven untersuchen</div>
        Nullstellen - Achsenschnittpunkte<br>
        Symmetrie - Extrempunkte<br>
        Wendepunkte - Krummungsverhalten<br>
        Monotonie - Tangente / Normale<br>
        Definitionsbereich - Wertemenge<br>
        Asymptoten (senkrecht / waagerecht)<br>
        Extremwertprobleme - Funktionenscharen
      </div>
    </button>

    <button class="node branch" id="b-abl" type="button">
      Ableiten
      <div class="panel">
        <div class="panel-title">Ableiten</div>
        Summen- und Faktorregel<br>
        Produktregel<br>
        Kettenregel<br>
        Potenzregel<br>
        Anderungsrate<br>
        Tangentensteigung<br>
        grafisch Ableiten
      </div>
    </button>

    <button class="node branch" id="b-int" type="button">
      Integrieren
      <div class="panel">
        <div class="panel-title">Integrieren</div>
        Integralfunktion<br>
        Stammfunktionen bilden<br>
        Lineare Substitution<br>
        Hauptsatz der Differential- und<br>Integralrechnung<br>
        Flachenberechnung - Summenbildung<br>
        rekonstruierter Bestand<br>
        Volumen von Rotationskorpern
      </div>
    </button>

    <button class="node branch" id="b-gleich" type="button">
      Gleichungen
      <div class="panel">
        <div class="panel-title">Gleichungen</div>
        quadratische Gleichungen<br>
        <span style="padding-left:14px;font-size:14px;">-> pq- / abc-Formel</span><br>
        Bruchgleichungen<br>
        Potenzgleichungen<br>
        Exponentialgleichungen<br>
        trigonometrische Gleichungen<br>
        <br>
        <span style="font-weight:700">Methoden:</span><br>
        Ausklammern - Nullprodukt - Substitution
      </div>
    </button>
  </div>
</div>

<p class="hint">Tippen/Klicken auf einen Ast fur Details</p>

<script>
(() => {
  const BASE_W = 1100;
  const BASE_H = 820;

  const viewport = document.getElementById('viewport');
  const canvas = document.getElementById('canvas');
  const svg = document.getElementById('svg-lines');

  function fitCanvas() {
    const available = Math.max(320, window.innerWidth - 28);
    const scale = Math.min(1, available / BASE_W);
    canvas.style.transform = `scale(${scale})`;
    viewport.style.width = `${BASE_W * scale}px`;
    viewport.style.height = `${BASE_H * scale}px`;
  }

  function centerOf(el) {
    return {
      x: el.offsetLeft + el.offsetWidth / 2,
      y: el.offsetTop + el.offsetHeight / 2
    };
  }

  function edgePoint(el, c) {
    const cx = el.offsetLeft + el.offsetWidth / 2;
    const cy = el.offsetTop + el.offsetHeight / 2;
    return { x: cx < c.x ? cx + el.offsetWidth / 2 : cx - el.offsetWidth / 2, y: cy };
  }

  function drawCurve(x1, y1, x2, y2) {
    const mx = (x1 + x2) / 2;
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', '#c9982f');
    path.setAttribute('stroke-width', '2.6');
    path.setAttribute('stroke-linecap', 'round');
    path.setAttribute('opacity', '0.56');
    path.setAttribute('marker-end', 'url(#arrow)');
    svg.appendChild(path);
  }

  function drawLines() {
    svg.innerHTML = '';
    svg.setAttribute('viewBox', `0 0 ${BASE_W} ${BASE_H}`);

    const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
    defs.innerHTML = `
      <marker id="arrow" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
        <polygon points="0 0, 7 2.5, 0 5" fill="#c9982f" opacity="0.6"/>
      </marker>`;
    svg.appendChild(defs);

    const center = document.getElementById('center');
    const c = centerOf(center);
    const lx = center.offsetLeft;
    const rx = lx + center.offsetWidth;

    ['b-funk', 'b-graph', 'b-kurv', 'b-abl', 'b-int', 'b-gleich'].forEach((id) => {
      const el = document.getElementById(id);
      const b = centerOf(el);
      const edge = edgePoint(el, c);
      const sx = b.x < c.x ? lx : rx;
      drawCurve(sx, c.y, edge.x, b.y);
    });
  }

  function wireTapPanels() {
    const branches = [...document.querySelectorAll('.branch')];
    branches.forEach((branch) => {
      branch.addEventListener('click', (event) => {
        event.stopPropagation();
        const isActive = branch.classList.contains('active');
        branches.forEach((b) => b.classList.remove('active'));
        if (!isActive) branch.classList.add('active');
      });
    });

    document.addEventListener('click', () => {
      branches.forEach((b) => b.classList.remove('active'));
    });
  }

  fitCanvas();
  drawLines();
  wireTapPanels();

  window.addEventListener('resize', () => {
    fitCanvas();
    drawLines();
  });
})();
</script>
</body>
</html>
