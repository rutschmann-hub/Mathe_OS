<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Funktionsmaschine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<style>
:root{
  --bg:#f3f5fa; --surface:#ffffff; --ink:#0f172a; --ink2:#334155; --muted:#64748b; --line:#e5e9f2; --soft:#f8fafc;
  --primary:#2563eb; --primary-d:#1d4ed8; --primary-50:#eff6ff; --primary-100:#dbeafe; --primary-200:#bfdbfe;
  --x:#e8710f; --x-50:#fff5eb; --x-200:#fed7aa;
  --y:#16a34a; --y-50:#effdf4; --y-200:#bbf7d0;
  --err:#dc2626; --err-50:#fef2f2;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 10px 30px -12px rgba(15,23,42,.12);
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- Layout ---------- */
.app{position:relative;max-width:1600px;margin:0 auto;padding:12px;display:grid;gap:12px;
  grid-template-columns:minmax(0,1fr);grid-template-areas:"m" "t" "p"}
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);border:1px solid rgba(15,23,42,.04);min-width:0}
.mcard{grid-area:m;padding:14px 18px 14px;display:flex;flex-direction:column}
.tcard{grid-area:t;padding:12px 16px 14px}
@media (min-width:1100px) and (max-height:860px){ .hint{display:none} }
.pcard{grid-area:p;padding:12px 16px 14px;display:flex;flex-direction:column;position:relative}
.chead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;flex-wrap:wrap}
h1,h2{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:1.05rem} h2{font-size:.95rem}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.iconbtn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink2);font-size:.82rem;font-weight:500;transition:background .15s,border-color .15s}
.iconbtn:hover{background:var(--soft);border-color:#d5dbe7}
.iconbtn[aria-pressed="true"]{background:var(--primary-50);border-color:var(--primary-200);color:var(--primary-d)}
.textbtn{border:0;background:none;color:var(--muted);font-size:.82rem;font-weight:500;padding:4px 8px;border-radius:8px}
.textbtn:hover{background:var(--soft);color:var(--ink)}

@media (min-width:1100px){
  html,body{height:100%}
  .app{height:100vh;min-height:640px;grid-template-columns:minmax(500px,.95fr) minmax(0,1.15fr);
    grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"m p" "t p";padding:16px;gap:16px}
  .mcard,.pcard{min-height:0}
}

/* ---------- Ablauf: Eingabe → Maschine → Ergebnis ---------- */
.flow{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;width:100%}
.pill{width:100%;max-width:440px;display:flex;align-items:center;gap:6px;padding:5px 5px 5px 16px;border-radius:999px;
  background:var(--surface);border:2px solid var(--x-200);transition:border-color .15s,box-shadow .15s}
.pill:focus-within{border-color:var(--x);box-shadow:0 0 0 4px rgba(232,113,15,.12)}
.pill label{font-weight:600;color:var(--x);white-space:nowrap}
.pill input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:1.1rem;padding:8px 4px;font-variant-numeric:tabular-nums}
.pill button{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:10px 16px;background:var(--x);color:#fff;
  font-weight:600;white-space:nowrap;transition:filter .15s}
.pill button:hover{filter:brightness(.95)}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--x);border-radius:999px;min-width:34px;height:28px;padding:0 9px;
  font-weight:600;font-size:.85rem;font-variant-numeric:tabular-nums;transition:background .15s,border-color .15s}
.chip:hover{background:var(--x-50);border-color:var(--x-200)}
.hint{font-size:.78rem;color:var(--muted);text-align:center}

/* Trichter (flach) + Maschine */
.mwrap{position:relative;width:100%;max-width:520px;padding-top:88px}
.funnel{position:absolute;top:0;left:calc(50% - 72px);width:144px;height:103px;pointer-events:none}
.funnel svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.funnel .back{z-index:5} .funnel .front{z-index:30}
.funnel.gulp svg{animation:gulp .35s ease-out}
.funnel.no svg{animation:no .45s ease-in-out}
@keyframes gulp{40%{transform:scale(1.04,.95)}100%{transform:none}}
@keyframes no{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}100%{transform:none}}
.reject{position:absolute;z-index:35;top:6px;left:calc(50% + 90px);max-width:200px;background:var(--err-50);color:var(--err);
  border:1px solid #fecaca;border-radius:12px;padding:8px 10px;font-size:.82rem;font-weight:500;line-height:1.35;
  box-shadow:0 6px 20px -8px rgba(220,38,38,.35);animation:pop .25s ease-out}
.reject b{display:block;font-weight:600}
@keyframes pop{from{transform:scale(.9);opacity:0}}

.machine{position:relative;background:var(--primary);color:#fff;border-radius:var(--r-lg);padding:14px 18px 16px;
  box-shadow:0 18px 40px -18px rgba(37,99,235,.65),inset 0 1px 0 rgba(255,255,255,.18)}
.formula{background:#fff;color:var(--ink);border-radius:var(--r-md);min-height:68px;display:flex;align-items:center;
  justify-content:safe center;font-size:1.9rem;padding:8px 14px;overflow:hidden;transition:box-shadow .2s}
.formula.secret{color:var(--primary)}
.machine.working .formula{box-shadow:0 0 0 4px rgba(255,255,255,.35)}
.fnrow{display:flex;align-items:center;gap:8px;margin-top:10px}
.fnrow label{font-size:.78rem;color:rgba(255,255,255,.75);white-space:nowrap}
#fn{flex:1;min-width:0;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.12);color:#fff;border-radius:var(--r-sm);
  padding:7px 10px;font-size:.95rem;outline:0}
#fn:focus{border-color:#fff;background:rgba(255,255,255,.18)}
#fn::placeholder{color:rgba(255,255,255,.6)}
#fn[readonly]{opacity:.7}
.fnmsg{min-height:1.2em;margin-top:6px;font-size:.8rem;color:rgba(255,255,255,.85);text-align:center}
.fnmsg.err{color:#fff;font-weight:600}
.machine.error{background:#b91c1c}
.calc{min-height:2.1em;margin-top:2px;display:flex;align-items:center;justify-content:safe center;font-size:1.08rem;overflow:hidden}
.mhelp{margin-top:2px;font-size:.74rem;color:rgba(255,255,255,.7);text-align:center}
.machine.nosyntax .fnrow,.machine.nosyntax .mhelp{display:none}
.progress{position:absolute;left:18px;right:18px;bottom:8px;height:3px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden;opacity:0;transition:opacity .2s}
.progress span{display:block;height:100%;width:40%;border-radius:3px;background:#fff}
.machine.working .progress{opacity:1}
.machine.working .progress span{animation:run .8s ease-in-out infinite}
@keyframes run{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
.mouth{position:absolute;left:50%;bottom:-11px;width:64px;height:12px;margin-left:-32px;background:var(--primary-d);
  clip-path:polygon(0 0,100% 0,85% 100%,15% 100%);border-radius:0 0 6px 6px}

.result{margin-top:10px;min-height:58px;width:100%;max-width:440px;display:flex;align-items:center;justify-content:center;gap:4px 16px;flex-wrap:wrap;
  padding:8px 16px;border-radius:var(--r-md);background:var(--soft);border:1px solid var(--line)}
.outbig{font-size:1.5rem;font-weight:600;text-align:center}
.outbig.empty{font-size:.9rem;font-weight:500;color:var(--muted)}
.outpair{font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
.result.bad{background:var(--err-50);border-color:#fecaca}

.fly{position:absolute;left:0;top:0;z-index:20;pointer-events:none;border-radius:999px;padding:7px 14px;font-weight:600;font-size:1.05rem;
  border:1.5px solid;box-shadow:0 8px 20px -8px rgba(15,23,42,.35);white-space:nowrap;font-variant-numeric:tabular-nums}
.fly.in{background:var(--x-50);border-color:var(--x);color:var(--x)}
.fly.out{background:var(--y-50);border-color:var(--y);color:var(--y)}
.fly.bad{background:var(--err-50);border-color:var(--err);color:var(--err)}

/* ---------- Wertetabelle (quer) ---------- */
.tablescroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md)}
.htable{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;min-width:100%}
.htable th,.htable td{padding:14px 16px;white-space:nowrap;border-right:1px solid var(--line)}
.htable tr+tr th,.htable tr+tr td{border-top:1px solid var(--line)}
.htable th{position:sticky;left:0;z-index:1;background:var(--soft);text-align:left;font-weight:600;width:64px;font-size:1.05rem}
.htable th.x{color:var(--x)} .htable th.y{color:var(--y)}
.htable td{text-align:right;min-width:72px;font-size:1.2rem;transition:background .12s}
.htable tr:first-child td{color:var(--x)} .htable tr:nth-child(2) td{color:var(--y);font-weight:600}
.htable td:last-child{border-right:0}
.htable tr.del td,.htable tr.del th{padding:2px 6px 4px;border-top:0;font-size:.8rem}
.htable tr.del button{border:0;background:none;color:var(--muted);opacity:0;padding:2px 6px;border-radius:6px;transition:opacity .12s}
.htable td.hot{background:var(--primary-50)}
.htable td.hot button{opacity:1}
.htable tr.del button:hover{color:var(--err);background:var(--err-50)}
.htable td.new{animation:flash 1.2s}
.htable td.pending{visibility:hidden}
@keyframes flash{from{background:#fef3c7}to{background:transparent}}
.htable td.empty{color:var(--muted);font-size:.95rem;text-align:left;white-space:normal;padding:20px 16px}

/* ---------- Koordinatensystem ---------- */
.ptools{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:.84rem;color:var(--ink2);user-select:none}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .track{width:32px;height:18px;border-radius:999px;background:#cbd5e1;position:relative;transition:background .2s;flex:none}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;
  box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked + .track{background:var(--primary)}
.switch input:checked + .track::after{transform:translateX(14px)}
.switch input:focus-visible + .track{outline:2px solid var(--primary);outline-offset:2px}
.plotwrap{position:relative;width:100%;height:clamp(300px,75vw,560px)}
@media (min-width:1100px){ .plotwrap{flex:1;height:auto;min-height:0} }
#plot{width:100%;height:100%;display:block;border-radius:var(--r-md);background:#fff;border:1px solid var(--line);touch-action:none;cursor:grab}
#plot.dragging{cursor:grabbing}
.coord{position:absolute;left:10px;bottom:10px;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:8px;
  padding:3px 8px;font-size:.78rem;color:var(--muted);pointer-events:none;font-variant-numeric:tabular-nums}
.zoombar{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;border-radius:12px;overflow:hidden;
  border:1px solid var(--line);background:rgba(255,255,255,.95);box-shadow:0 4px 12px -6px rgba(15,23,42,.2)}
.zoombar button{width:34px;height:34px;border:0;background:transparent;color:var(--ink2);display:grid;place-items:center}
.zoombar button+button{border-top:1px solid var(--line)}
.zoombar button:hover{background:var(--soft)}
.popover{position:absolute;z-index:40;top:52px;right:16px;width:270px;background:#fff;border:1px solid var(--line);border-radius:16px;
  box-shadow:0 18px 40px -12px rgba(15,23,42,.25);padding:14px;display:grid;gap:12px}
.popover[hidden]{display:none}
.popover h3{margin:0;font-size:.85rem;font-weight:600}
.rangegrid{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:6px 8px;align-items:center;font-size:.82rem;color:var(--muted)}
.rangegrid input{width:100%;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-variant-numeric:tabular-nums;outline:0}
.rangegrid input:focus{border-color:var(--primary)}
.popbtns{display:flex;gap:8px}
.btn{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;font-size:.82rem;font-weight:500}
.btn:hover{background:var(--soft)}

.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
  padding:9px 16px;border-radius:999px;font-size:.88rem;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:480px){
  .app{padding:8px;gap:8px} .mcard{padding:12px} .formula{font-size:1.5rem}
  .reject{left:auto;right:0;top:-6px}
}
@media (prefers-reduced-motion:reduce){ .machine.working .progress span{animation:none} }
</style>
</head>
<body>
<div class="app" id="app">

  <!-- ===== Maschine: Eingabe → Trichter → f → Ergebnis ===== -->
  <section class="card mcard">
    <div class="chead">
      <h1>Funktionsmaschine</h1>
      <div class="tools">
        <button class="iconbtn" id="hideBtn" aria-pressed="false" title="Funktion verbergen (Rätselmodus)"></button>
        <button class="iconbtn" id="syntaxBtn" aria-pressed="true" title="Eingabezeile ausblenden">
          <svg class="i" viewBox="0 0 24 24"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5"/></svg>Eingabe
        </button>
      </div>
    </div>

    <div class="flow">
      <div class="pill" id="inCard">
        <label for="xin">x =</label>
        <input id="xin" inputmode="decimal" autocomplete="off" placeholder="z. B. 2 oder 1,5" aria-describedby="xhint">
        <button id="feedBtn">Einwerfen <svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg></button>
      </div>
      <div class="chips" id="chips"></div>
      <div class="hint" id="xhint">Mehrere Werte mit Semikolon trennen, z. B. −2; 0; 1,5; pi</div>

      <div class="mwrap">
        <div class="funnel" id="funnel" aria-hidden="true">
          <svg class="back" viewBox="0 0 190 136">
            <ellipse cx="95" cy="20" rx="88" ry="16" fill="#1e3a8a"/>
          </svg>
          <svg class="front" viewBox="0 0 190 136">
            <path d="M7 20 A88 16 0 0 0 183 20 L112 98 L112 136 L78 136 L78 98 Z" fill="#93c5fd"/>
            <path d="M7 20 A88 16 0 0 0 183 20" fill="none" stroke="#dbeafe" stroke-width="4"/>
            <path d="M95 36 L183 20 L112 98 L112 136 L95 136 Z" fill="#60a5fa" opacity=".55"/>
          </svg>
        </div>
        <div class="reject" id="reject" role="alert" hidden></div>

        <div class="machine" id="machine">
          <div class="formula" id="fnTex" aria-live="polite"></div>
          <div class="fnrow">
            <label for="fn">Eingabe</label>
            <input id="fn" value="0,5x^2-2" spellcheck="false" autocomplete="off" autocapitalize="off" aria-describedby="fnMsg">
          </div>
          <div class="fnmsg" id="fnMsg" aria-live="polite"></div>
          <div class="calc" id="calc" aria-live="polite"></div>
          <div class="mhelp">Erlaubt: + − · / ^ ( ) sowie sqrt, sin, cos, tan, ln, exp, abs, pi, e</div>
          <div class="progress" aria-hidden="true"><span></span></div>
          <div class="mouth" id="mouthOut" aria-hidden="true"></div>
        </div>
      </div>

      <div class="result" id="outCard" aria-live="polite">
        <div class="outbig empty" id="outBig">Das Ergebnis erscheint hier</div>
        <div class="outpair" id="outPair"></div>
      </div>
    </div>
  </section>

  <!-- ===== Wertetabelle ===== -->
  <section class="card tcard">
    <div class="chead">
      <h2>Wertetabelle</h2>
      <button class="textbtn" id="clearBtn">Alle löschen</button>
    </div>
    <div class="tablescroll" id="tscroll">
      <table class="htable"><tbody id="tbody"></tbody></table>
    </div>
  </section>

  <!-- ===== Koordinatensystem ===== -->
  <section class="card pcard">
    <div class="chead">
      <h2>Koordinatensystem</h2>
      <div class="ptools">
        <label class="switch"><input type="checkbox" id="optGraph" checked><span class="track"></span>Graph</label>
        <label class="switch"><input type="checkbox" id="optLabels" checked><span class="track"></span>Koordinaten</label>
        <label class="switch"><input type="checkbox" id="optAnim" checked><span class="track"></span>Animation</label>
        <button class="iconbtn" id="settingsBtn" aria-expanded="false" aria-controls="popover" title="Ansicht einstellen">
          <svg class="i" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Ansicht
        </button>
      </div>
    </div>
    <div class="popover" id="popover" hidden>
      <h3>Bereich</h3>
      <div class="rangegrid">
        <span>x von</span><input id="xmin" type="number" step="any"><span>bis</span><input id="xmax" type="number" step="any">
        <span>y von</span><input id="ymin" type="number" step="any"><span>bis</span><input id="ymax" type="number" step="any">
      </div>
      <label class="switch"><input type="checkbox" id="optEqual" checked><span class="track"></span>Einheiten 1 : 1</label>
      <label class="switch"><input type="checkbox" id="optAuto" checked><span class="track"></span>Ansicht automatisch erweitern</label>
      <div class="popbtns">
        <button class="btn" id="fitBtn">Auf Punkte zoomen</button>
        <button class="btn" id="stdBtn">Standard</button>
      </div>
    </div>
    <div class="plotwrap">
      <canvas id="plot" aria-label="Koordinatensystem mit den berechneten Punkten"></canvas>
      <div class="coord" id="coord" hidden></div>
      <div class="zoombar">
        <button id="zoomIn" title="Hineinzoomen" aria-label="Hineinzoomen"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        <button id="zoomOut" title="Herauszoomen" aria-label="Herauszoomen"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
        <button id="zoomHome" title="Standardansicht" aria-label="Standardansicht"><svg class="i" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7M6 9.5V20h12V9.5"/></svg></button>
      </div>
    </div>
  </section>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);

/* =========================================================
   Ausdrucks-Parser (ohne eval) – deutsche Schreibweise
   erzeugt einen Syntaxbaum (AST) für Auswertung und LaTeX
   ========================================================= */
const FUNCS = {
  sqrt:Math.sqrt, wurzel:Math.sqrt, sin:Math.sin, cos:Math.cos, tan:Math.tan,
  ln:Math.log, log:Math.log10, lg:Math.log10, exp:Math.exp, abs:Math.abs, betrag:Math.abs
};
const CONSTS = { pi:Math.PI, e:Math.E };
const WORDS = [...Object.keys(FUNCS), ...Object.keys(CONSTS), "x"].sort((a,b)=>b.length-a.length);

function normalize(src){
  return src.trim()
    .replace(/^\s*(f\s*\(\s*x\s*\)|y)\s*=\s*/i, "")
    .replace(/²/g,"^2").replace(/³/g,"^3")
    .replace(/[·×⋅∙]/g,"*").replace(/[−–—]/g,"-").replace(/[÷:]/g,"/")
    .replace(/π/g,"pi").replace(/√/g,"sqrt");
}

function tokenize(s, allowX){
  const toks = []; let i = 0;
  while (i < s.length){
    const c = s[i];
    if (/\s/.test(c)) { i++; continue; }
    if (/[0-9.,]/.test(c)){
      let j = i; while (j < s.length && /[0-9.,]/.test(s[j])) j++;
      const raw = s.slice(i,j), t = raw.replace(",",".");
      if (/[.,].*[.,]/.test(raw) || t === ".") throw new Error("Ungültige Zahl „" + raw + "“");
      toks.push({t:"num", v:parseFloat(t)}); i = j; continue;
    }
    if (/[a-zA-ZäöüÄÖÜ]/.test(c)){
      let j = i; while (j < s.length && /[a-zA-ZäöüÄÖÜ]/.test(s[j])) j++;
      let w = s.slice(i,j).toLowerCase();
      while (w.length){
        const m = WORDS.find(k => w.startsWith(k));
        if (!m) throw new Error("Unbekannt: „" + w + "“");
        if (m === "x" && !allowX) throw new Error("Hier ist kein x erlaubt");
        toks.push(m in FUNCS ? {t:"fn", v:m} : m in CONSTS ? {t:"const", v:m} : {t:"x"});
        w = w.slice(m.length);
      }
      i = j; continue;
    }
    if ("+-*/^()".includes(c)) { toks.push({t:c}); i++; continue; }
    if (c === "[" || c === "{") { toks.push({t:"("}); i++; continue; }
    if (c === "]" || c === "}") { toks.push({t:")"}); i++; continue; }
    throw new Error("Unbekanntes Zeichen „" + c + "“");
  }
  return toks;
}

const startsOperand = tok => tok && (tok.t==="num"||tok.t==="x"||tok.t==="const"||tok.t==="fn"||tok.t==="(");

function parseTokens(toks){
  let p = 0;
  const peek = () => toks[p], next = () => toks[p++];
  const expect = t => { if (!peek() || peek().t !== t) throw new Error(t===")" ? "Klammer „)“ fehlt" : "„"+t+"“ erwartet"); p++; };

  function expr(){
    let a = term();
    while (peek() && (peek().t==="+" || peek().t==="-")){
      const op = next().t; a = {k: op==="+" ? "add" : "sub", a, b: term()};
    }
    return a;
  }
  function term(){
    let a = unary();
    for(;;){
      const tk = peek();
      if (tk && (tk.t==="*" || tk.t==="/")){ next(); a = {k: tk.t==="*" ? "mul" : "div", a, b: unary()}; }
      else if (startsOperand(tk)){ a = {k:"mul", a, b: power()}; }   // implizit: 2x, 3(x+1)
      else break;
    }
    return a;
  }
  function unary(){
    const tk = peek();
    if (tk && tk.t==="-"){ next(); return {k:"neg", a: unary()}; }
    if (tk && tk.t==="+"){ next(); return unary(); }
    return power();
  }
  function power(){
    const base = primary();
    if (peek() && peek().t==="^"){ next(); return {k:"pow", a: base, b: unary()}; }
    return base;
  }
  function primary(){
    const tk = next();
    if (!tk) throw new Error("Ausdruck unvollständig");
    switch (tk.t){
      case "num":   return {k:"num", v:tk.v};
      case "x":     return {k:"x"};
      case "const": return {k:"const", v:tk.v};
      case "fn":    if (!peek()) throw new Error(tk.v + " braucht ein Argument");
                    return {k:"fn", f:tk.v, a: peek().t==="(" ? primary() : power()};
      case "(":     { const a = expr(); expect(")"); return {k:"par", a}; }
      default: throw new Error("„" + tk.t + "“ an dieser Stelle nicht erwartet");
    }
  }
  if (!toks.length) throw new Error("Bitte eine Funktion eingeben");
  const ast = expr();
  if (p < toks.length) throw new Error(toks[p].t===")" ? "Zu viele „)“" : "Unerwartetes Zeichen");
  return ast;
}

function evalAst(n, x){
  switch (n.k){
    case "num": return n.v;
    case "x": return x;
    case "const": return CONSTS[n.v];
    case "par": return evalAst(n.a, x);
    case "neg": return -evalAst(n.a, x);
    case "add": return evalAst(n.a, x) + evalAst(n.b, x);
    case "sub": return evalAst(n.a, x) - evalAst(n.b, x);
    case "mul": return evalAst(n.a, x) * evalAst(n.b, x);
    case "div": return evalAst(n.a, x) / evalAst(n.b, x);
    case "pow": return Math.pow(evalAst(n.a, x), evalAst(n.b, x));
    case "fn":  return FUNCS[n.f](evalAst(n.a, x));
  }
}

function compile(src, allowX=true){
  const ast = parseTokens(tokenize(normalize(src), allowX));
  return { ast, f: x => evalAst(ast, x) };
}

/* ---------- AST → LaTeX ---------- */
const unpar = n => n.k === "par" ? unpar(n.a) : n;
function texNum(v){
  let r = Math.round(v * 1e4) / 1e4; if (Object.is(r,-0)) r = 0;
  return String(r).replace(".", "{,}");
}
// Rangfolge: 1 = Summe, 2 = Produkt/Vorzeichen, 3 = Potenz, 4 = Atom
function prec(n, xv){
  n = unpar(n);
  switch (n.k){
    case "add": case "sub": return 1;
    case "mul": case "neg": return 2;
    case "div": return 4;          // \frac ist geschlossen
    case "pow": return 3;
    case "num": return n.v < 0 ? 2 : 4;
    default: return 4;
  }
}
// Beginnt der LaTeX-Ausdruck mit einer Ziffer? (dann braucht ein Produkt einen Malpunkt)
function startsWithDigit(n, xv){
  n = unpar(n);
  if (n.k === "par") return false;
  switch (n.k){
    case "num": return true;
    case "x":   return xv !== undefined && xv >= 0;
    case "mul": case "pow": return startsWithDigit(n.a, xv);
    default: return false;
  }
}
// free = Stelle, an der ein negativer eingesetzter Wert keine Klammern braucht
function toTex(n, xv, free){
  const T = m => toTex(m, xv);
  const F = m => toTex(m, xv, true);
  const wrap = (m, minPrec) => prec(m, xv) < minPrec ? "\\left(" + F(unpar(m)) + "\\right)" : T(unpar(m));
  switch (n.k){
    case "par": {
      // Klammern des Nutzers nur behalten, wenn sie nötig sind – darüber entscheiden die Eltern
      return toTex(n.a, xv, free);
    }
    case "num": return texNum(n.v);
    case "x":   return xv === undefined ? "x" : (xv < 0 && !free ? "\\left(" + texNum(xv) + "\\right)" : texNum(xv));
    case "const": return n.v === "pi" ? "\\pi" : "\\mathrm{e}";
    case "neg": return "-" + wrap(n.a, 2);
    case "add": {
      const b = unpar(n.b);
      return toTex(n.a, xv, free) + "+" + (b.k === "neg" || (b.k === "num" && b.v < 0) ? "\\left(" + F(b) + "\\right)" : T(b));
    }
    case "sub": {
      const b = unpar(n.b);
      return toTex(n.a, xv, free) + "-" + (b.k === "neg" || prec(b, xv) <= 1 ? "\\left(" + F(b) + "\\right)" : T(b));
    }
    case "mul": {
      const b = unpar(n.b);
      const right = (prec(b, xv) < 3 || startsNeg(b, xv)) ? "\\left(" + F(b) + "\\right)" : T(b);
      const dot = xv !== undefined || startsWithDigit(b, xv);
      return wrap(n.a, 2) + (dot ? "\\cdot " : "") + right;
    }
    case "div": return "\\frac{" + F(n.a) + "}{" + F(n.b) + "}";
    case "pow": {
      const a = unpar(n.a);
      const base = (a.k === "fn" || prec(a, xv) < 4 || (a.k === "num" && a.v < 0)) ? "\\left(" + F(a) + "\\right)" : T(a);
      return base + "^{" + F(n.b) + "}";
    }
    case "fn": {
      const a = F(n.a);
      switch (n.f){
        case "sqrt": case "wurzel": return "\\sqrt{" + a + "}";
        case "abs": case "betrag": return "\\left|" + a + "\\right|";
        case "exp": return "\\mathrm{e}^{" + a + "}";
        case "ln": return "\\ln\\left(" + a + "\\right)";
        case "log": case "lg": return "\\log_{10}\\left(" + a + "\\right)";
        default: return "\\" + n.f + "\\left(" + a + "\\right)";
      }
    }
  }
}
function startsNeg(n, xv){
  n = unpar(n);
  if (n.k === "neg") return true;
  if (n.k === "mul" || n.k === "pow") return startsNeg(n.a, xv);
  return false;
}

/* Anzeige aufräumen: gleiche x-Faktoren werden zur Potenz zusammengefasst
   (xxx → x³, 2xx → 2x², x·x² → x³). Gerechnet wird weiter mit dem Original. */
function tidy(n){
  if (!n || typeof n !== "object") return n;
  if (n.k === "num" || n.k === "x" || n.k === "const") return n;
  if (n.k !== "mul"){
    const m = {...n};
    if (m.a) m.a = tidy(m.a);
    if (m.b) m.b = tidy(m.b);
    return m;
  }
  const factors = []; let sign = 1;
  (function flat(m){
    if (m.k === "mul"){ flat(m.a); flat(m.b); }
    else if (m.k === "neg"){ sign = -sign; flat(m.a); }      // -xx → -(x·x)
    else factors.push(tidy(m));
  })(n);
  const xExp = f => f.k === "x" ? 1
    : (f.k === "pow" && f.a.k === "x" && f.b.k === "num" && Number.isInteger(f.b.v)) ? f.b.v : null;
  const count = factors.filter(f => xExp(f) !== null).length;
  let out = factors;
  if (count >= 2){
    const e = factors.reduce((s, f) => s + (xExp(f) ?? 0), 0);
    const merged = e === 1 ? {k:"x"} : e === 0 ? {k:"num", v:1} : {k:"pow", a:{k:"x"}, b:{k:"num", v:e}};
    out = []; let placed = false;
    for (const f of factors){
      if (xExp(f) === null) out.push(f);
      else if (!placed){ out.push(merged); placed = true; }
    }
  }
  const prod = out.reduce((a, b) => ({k:"mul", a, b}));
  return sign < 0 ? {k:"neg", a:prod} : prod;
}

/* LaTeX anzeigen – Fallback auf Klartext, falls KaTeX nicht geladen werden konnte */
function renderTex(el, tex, fallback){
  el.style.fontSize = "";
  let ok = false;
  if (window.katex){
    try { katex.render("\\displaystyle " + tex, el, {throwOnError:false, displayMode:false}); ok = true; } catch(e){}
  }
  if (!ok) el.textContent = fallback;
  // zu lange Formeln verkleinern, bis sie in den Bildschirm passen
  let size = parseFloat(getComputedStyle(el).fontSize);
  while (el.scrollWidth > el.clientWidth + 1 && size > 11){
    size *= 0.92; el.style.fontSize = size + "px";
  }
}

   Hilfsfunktionen
   ========================================================= */
function fmt(v, digits=4){
  if (!isFinite(v)) return "n. def.";
  let r = Math.round(v * 10**digits) / 10**digits;
  if (Object.is(r,-0)) r = 0;
  if (Math.abs(r) >= 1e9) return v.toExponential(3).replace(".",",");
  return String(r).replace(".",",").replace("-","−");
}
function niceStep(raw){
  const p = 10 ** Math.floor(Math.log10(raw)), f = raw / p;
  return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p;
}

/* =========================================================
   Definitionsmenge: Auswertung mit verständlichem Grund
   ========================================================= */
class DomainError extends Error {}
function evalChecked(n, x){
  const E = m => evalChecked(m, x);
  switch (n.k){
    case "num": return n.v;
    case "x": return x;
    case "const": return CONSTS[n.v];
    case "par": return E(n.a);
    case "neg": return -E(n.a);
    case "add": return E(n.a) + E(n.b);
    case "sub": return E(n.a) - E(n.b);
    case "mul": return E(n.a) * E(n.b);
    case "div": {
      const a = E(n.a), b = E(n.b);
      if (b === 0) throw new DomainError("Teilen durch 0 geht nicht.");
      return a / b;
    }
    case "pow": {
      const a = E(n.a), b = E(n.b);
      if (a === 0 && b < 0) throw new DomainError("Teilen durch 0 geht nicht.");
      if (a < 0 && !Number.isInteger(b)) throw new DomainError("Eine negative Zahl hoch einen Bruch ist nicht definiert.");
      return Math.pow(a, b);
    }
    case "fn": {
      const a = E(n.a);
      if ((n.f === "sqrt" || n.f === "wurzel") && a < 0) throw new DomainError("Die Wurzel aus einer negativen Zahl gibt es nicht.");
      if ((n.f === "ln" || n.f === "log" || n.f === "lg") && a <= 0) throw new DomainError("Den Logarithmus gibt es nur für positive Zahlen.");
      if (n.f === "tan" && Math.abs(Math.cos(a)) < 1e-12) throw new DomainError("Der Tangens ist hier nicht definiert.");
      return FUNCS[n.f](a);
    }
  }
}
function evaluate(x){
  try {
    const y = evalChecked(state.ast, x);
    if (!isFinite(y)) return { y:NaN, why:"Das Ergebnis ist nicht definiert." };
    return { y, why:null };
  } catch(e){
    if (e instanceof DomainError) return { y:NaN, why:e.message };
    throw e;
  }
}

function parseXList(text){
  const parts = text.split(/[;|]/).map(s => s.trim()).filter(Boolean);
  const vals = [];
  for (const part of parts){
    try { vals.push(compile(part, false).f(0)); }
    catch(e){
      const sub = part.split(/\s+/);           // Fallback: "1 2 3"
      if (sub.length < 2) throw new Error("„" + part + "“: " + e.message);
      for (const s of sub) vals.push(compile(s, false).f(0));
    }
  }
  return vals.filter(v => isFinite(v));
}
function feedFromInput(){
  const txt = $("xin").value;
  if (!txt.trim()){ toast("Bitte einen x-Wert eingeben"); $("xin").focus(); return; }
  let vals;
  try { vals = parseXList(txt); } catch(e){ toast(e.message); return; }
  if (!vals.length){ toast("Kein gültiger x-Wert"); return; }
  $("xin").value = "";
  feed(vals);
}

async function feed(values){
  if (fnInput.value.trim() !== state.applied && !applyFn()) { toast("Die Funktion ist noch fehlerhaft"); return; }
  if (!state.fn){ toast("Bitte zuerst eine Funktion eingeben"); return; }
  state.queue.push(...values);
  if (state.busy) return;
  state.busy = true;
  while (state.queue.length){
    const x = state.queue.shift();
    await processOne(x, state.queue.length > 0);
  }
  state.busy = false;
}

function rectIn(el){
  const s = $("app").getBoundingClientRect(), r = el.getBoundingClientRect();
  return { x:r.left - s.left, y:r.top - s.top, w:r.width, h:r.height, cx:r.left - s.left + r.width/2, cy:r.top - s.top + r.height/2 };
}
function makeFly(cls, text){
  const d = document.createElement("div");
  d.className = "fly " + cls; d.textContent = text;
  $("app").appendChild(d);
  return d;
}
const tr = (x, y, s=1, r=0) => `translate(${x}px, ${y}px) rotate(${r}deg) scale(${s})`;

/* Karte gleitet zum Trichter. Liegt x außerhalb der Definitionsmenge, wird sie abgewiesen. */
async function dropIntoFunnel(x, speed, rejected){
  const from = rectIn($("inCard")), fun = rectIn($("funnel"));
  const card = makeFly("in", "x = " + fmt(x));
  const w = card.offsetWidth, h = card.offsetHeight;
  const sx = from.cx - w/2, sy = from.cy - h/2;
  const k = fun.w / 190;
  const rimX = fun.x + 95*k - w/2, rimY = fun.y + 20*k - h/2;
  const fit = Math.min(0.85, (150*k) / w);
  const hoverY = Math.max(2, rimY - 26*k);

  await card.animate([
    { transform: tr(sx, sy, 1) },
    { transform: tr(rimX, hoverY, fit) }
  ], { duration: 600*speed, easing:"cubic-bezier(.3,.7,.4,1)", fill:"forwards" }).finished;

  if (rejected){
    card.classList.replace("in", "bad");
    $("funnel").classList.remove("no"); void $("funnel").offsetWidth; $("funnel").classList.add("no");
    await card.animate([
      { transform: tr(rimX, hoverY, fit) },
      { transform: tr(rimX - 8, hoverY, fit, -6), offset:.2 },
      { transform: tr(rimX + 8, hoverY, fit, 6), offset:.4 },
      { transform: tr(rimX, hoverY, fit), offset:.55 },
      { transform: tr(sx, sy, 1), opacity:0 }
    ], { duration: 1100*speed, easing:"ease-in-out", fill:"forwards" }).finished;
    card.remove();
    return;
  }
  $("funnel").classList.remove("gulp"); void $("funnel").offsetWidth; $("funnel").classList.add("gulp");
  await card.animate([
    { transform: tr(rimX, hoverY, fit), opacity:1 },
    { transform: tr(rimX, rimY + 40*k, fit*.7), opacity:1, offset:.6 },
    { transform: tr(rimX, rimY + 95*k, fit*.35), opacity:0 }
  ], { duration: 480*speed, easing:"cubic-bezier(.5,0,.9,.6)", fill:"forwards" }).finished;
  card.remove();
}

async function processOne(x, more){
  const { y, why } = evaluate(x);
  const anim = $("optAnim").checked && !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const speed = more ? 0.6 : 1;
  const calcEl = $("calc");
  const lhs = "f\\!\\left(" + texNum(x) + "\\right)";

  if (why){                                         // außerhalb der Definitionsmenge
    showReject(x, why);
    if (anim) await dropIntoFunnel(x, speed, true);
    setOutput(x, NaN, why);
    calcEl.textContent = "";
    state.lastX = null; draw();
    return;
  }

  if (anim){
    await dropIntoFunnel(x, speed, false);
    machine.classList.add("working");
    if (!state.hidden) renderTex(calcEl, lhs + "=" + toTex(tidy(state.ast), x, true), "f(" + fmt(x) + ") = …");
    else renderTex(calcEl, lhs + "= \\;?", "f(" + fmt(x) + ") = ?");
    await sleep(750*speed);
    machine.classList.remove("working");

    const o1 = rectIn($("mouthOut")), o2 = rectIn($("outBig"));
    const oc = makeFly("out", "y = " + fmt(y));
    const ow = oc.offsetWidth, oh = oc.offsetHeight;
    await oc.animate([
      { transform: tr(o1.cx - ow/2, o1.cy - oh/2 - 14, .4), opacity:0 },
      { transform: tr(o1.cx - ow/2, o1.cy - oh/2, .7), opacity:1, offset:.25 },
      { transform: tr(o2.cx - ow/2, o2.cy - oh/2, 1), opacity:1 }
    ], { duration:550*speed, easing:"ease-out", fill:"forwards" }).finished;
    oc.remove();
  }

  if (!state.hidden) renderTex(calcEl, lhs + "=" + toTex(tidy(state.ast), x, true) + "=" + texNum(y), "f(" + fmt(x) + ") = " + fmt(y));
  else renderTex(calcEl, lhs + "=" + texNum(y), "f(" + fmt(x) + ") = " + fmt(y));
  setOutput(x, y);
  addPoint(x, y, anim);
  if (anim) await flyToTable(x, y, speed);
  if (anim) await sleep(120*speed);
}

/* Wertepaar gleitet von der Ausgabe in die Wertetabelle */
async function flyToTable(x, y, speed){
  const cells = [...$("tbody").querySelectorAll("td.new")];
  if (!cells.length) return;
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  const from = rectIn($("outCard")), tx = rectIn(cells[0]), ty = rectIn(cells[1] || cells[0]);
  const card = makeFly("out", `${fmt(x)} | ${fmt(y)}`);
  const w = card.offsetWidth, h = card.offsetHeight;
  await card.animate([
    { transform: tr(from.cx - w/2, from.cy - h/2, 1), opacity:1 },
    { transform: tr(tx.cx - w/2, (tx.cy + ty.cy)/2 - h/2, .75), opacity:.9 }
  ], { duration: 600*speed, easing:"cubic-bezier(.4,0,.2,1)", fill:"forwards" }).finished;
  card.remove();
  cells.forEach(c => { c.classList.remove("pending", "new"); void c.offsetWidth; c.classList.add("new"); });
}

function setOutput(x, y, why){
  const big = $("outBig"), pair = $("outPair"), box = $("outCard");
  box.classList.toggle("bad", !!why);
  if (x === null){ big.className = "outbig empty"; big.textContent = "Das Ergebnis erscheint hier"; pair.textContent = ""; return; }
  big.className = "outbig";
  if (why){
    renderTex(big, "x = " + texNum(x) + " \\notin \\mathbb{D}_f", "x = " + fmt(x) + " gehört nicht zur Definitionsmenge");
    pair.textContent = why;
    return;
  }
  renderTex(big, "\\color{#64748b}{f\\!\\left(\\color{#e8710f}{" + texNum(x) + "}\\right) =}\\; \\color{#16a34a}{" + texNum(y) + "}",
            "f(" + fmt(x) + ") = " + fmt(y));
  pair.textContent = `P(${fmt(x)} | ${fmt(y)})`;
}

/* =========================================================
   Punkte & Tabelle
   ========================================================= */
function addPoint(x, y, pending){
  state.lastX = x;
  if (!state.points.some(p => Math.abs(p.x - x) < 1e-12)){
    state.points.push({x, y});
    state.points.sort((a,b) => a.x - b.x);
  }
  if ($("optAuto").checked) ensureVisible(x, y);
  renderTable(pending); draw();
}
function ensureVisible(x, y){
  const v = state.view;
  const px = (v.xmax - v.xmin) * 0.08, py = (v.ymax - v.ymin) * 0.08;
  let changed = false;
  if (x < v.xmin + px*0.3){ v.xmin = niceFloor(x - px); changed = true; }
  if (x > v.xmax - px*0.3){ v.xmax = niceCeil(x + px); changed = true; }
  if (y < v.ymin + py*0.3){ v.ymin = niceFloor(y - py); changed = true; }
  if (y > v.ymax - py*0.3){ v.ymax = niceCeil(y + py); changed = true; }
  if (changed) syncRangeInputs();
}
function niceFloor(v){ const s = niceStep(Math.max(Math.abs(v),1)/5); return Math.floor(v/s)*s; }
function niceCeil(v){ const s = niceStep(Math.max(Math.abs(v),1)/5); return Math.ceil(v/s)*s; }

function setHover(x){
  if (state.hoverX === x) return;
  state.hoverX = x;
  $("tbody").querySelectorAll("td[data-x]").forEach(td => td.classList.toggle("hot", x !== null && +td.dataset.x === x));
  draw();
}
function renderTable(pending){
  const tb = $("tbody"); tb.innerHTML = "";
  const rx = document.createElement("tr"), ry = document.createElement("tr"), rd = document.createElement("tr");
  rx.innerHTML = '<th class="x" scope="row">x</th>';
  ry.innerHTML = '<th class="y" scope="row">f(x)</th>';
  rd.className = "del"; rd.innerHTML = "<th></th>";
  if (!state.points.length){
    rx.insertAdjacentHTML("beforeend", '<td class="empty" rowspan="2">Noch keine Werte – wirf ein x in die Maschine.</td>');
    tb.append(rx, ry);
    return;
  }
  let newCell = null;
  for (const p of state.points){
    const isNew = p.x === state.lastX;
    const cells = [document.createElement("td"), document.createElement("td"), document.createElement("td")];
    cells[0].textContent = fmt(p.x); cells[1].textContent = fmt(p.y);
    cells[2].innerHTML = `<button title="Wert löschen" aria-label="Wert löschen">${ICON_X}</button>`;
    cells.forEach(c => {
      c.dataset.x = p.x;
      c.addEventListener("mouseenter", () => setHover(p.x));
      c.addEventListener("mouseleave", () => setHover(null));
    });
    if (isNew){ cells[0].className = cells[1].className = pending ? "new pending" : "new"; newCell = cells[1]; }
    cells[2].firstChild.addEventListener("click", () => {
      state.points = state.points.filter(q => q !== p);
      state.hoverX = null; renderTable(); draw();
    });
    rx.appendChild(cells[0]); ry.appendChild(cells[1]); rd.appendChild(cells[2]);
  }
  tb.append(rx, ry, rd);
  if (newCell){
    const sc = $("tscroll");
    requestAnimationFrame(() => {
      const c = newCell.getBoundingClientRect(), r = sc.getBoundingClientRect();
      if (c.right > r.right) sc.scrollLeft += c.right - r.right + 8;
      else if (c.left < r.left + 60) sc.scrollLeft -= r.left + 60 - c.left;
    });
  }
}
$("clearBtn").addEventListener("click", () => {
  state.points = []; state.lastX = null; state.hoverX = null; setOutput(null); $("calc").textContent = "";
  renderTable(); draw();
});

/* =========================================================
   Koordinatensystem
   ========================================================= */
const canvas = $("plot"), ctx = canvas.getContext("2d");
const C = { grid:"#eef1f6", axis:"#334155", label:"#64748b", curve:"#2563eb", x:"#e8710f", y:"#16a34a", ink:"#0f172a" };
const FONT = getComputedStyle(document.body).fontFamily;

/* Sichtbarer Bereich: bei "Einheiten 1:1" wird die kürzere Richtung erweitert */
function effView(W, H){
  const v = state.view;
  if (!$("optEqual").checked || !W || !H) return v;
  const u = Math.max((v.xmax - v.xmin) / W, (v.ymax - v.ymin) / H);
  const cx = (v.xmin + v.xmax) / 2, cy = (v.ymin + v.ymax) / 2;
  return { xmin: cx - u*W/2, xmax: cx + u*W/2, ymin: cy - u*H/2, ymax: cy + u*H/2 };
}
function syncRangeInputs(){ for (const k of ["xmin","xmax","ymin","ymax"]) $(k).value = +state.view[k].toFixed(2); }
for (const k of ["xmin","xmax","ymin","ymax"]){
  $(k).addEventListener("change", () => {
    const v = parseFloat($(k).value);
    const nv = {...state.view, [k]: v};
    if (!isFinite(v) || nv.xmin >= nv.xmax || nv.ymin >= nv.ymax){ toast("Ungültiger Bereich"); syncRangeInputs(); return; }
    state.view = nv; draw();
  });
}
$("stdBtn").addEventListener("click", () => { state.view = {...STD_VIEW}; syncRangeInputs(); draw(); });
$("fitBtn").addEventListener("click", () => {
  if (!state.points.length){ toast("Noch keine Punkte vorhanden"); return; }
  const xs = state.points.map(p=>p.x).concat(0), ys = state.points.map(p=>p.y).concat(0);
  let x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  if (x1 - x0 < 2){ x0 -= 1; x1 += 1; }
  if (y1 - y0 < 2){ y0 -= 1; y1 += 1; }
  const dx = (x1-x0)*0.12, dy = (y1-y0)*0.12;
  state.view = { xmin:niceFloor(x0-dx), xmax:niceCeil(x1+dx), ymin:niceFloor(y0-dy), ymax:niceCeil(y1+dy) };
  syncRangeInputs(); draw();
});
["optLabels","optGraph","optEqual"].forEach(id => $(id).addEventListener("change", draw));

// Einstellungs-Popover
const pop = $("popover"), popBtn = $("settingsBtn");
function setPop(open){ pop.hidden = !open; popBtn.setAttribute("aria-expanded", String(open)); popBtn.setAttribute("aria-pressed", String(open)); }
popBtn.addEventListener("click", e => { e.stopPropagation(); setPop(pop.hidden); });
document.addEventListener("click", e => { if (!pop.hidden && !pop.contains(e.target)) setPop(false); });
document.addEventListener("keydown", e => { if (e.key === "Escape") setPop(false); });

function draw(){
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  if (!W || !H) return;
  if (canvas.width !== Math.round(W*dpr) || canvas.height !== Math.round(H*dpr)){
    canvas.width = Math.round(W*dpr); canvas.height = Math.round(H*dpr);
  }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  const {xmin,xmax,ymin,ymax} = effView(W, H);
  const X = x => (x - xmin) / (xmax - xmin) * W;
  const Y = y => H - (y - ymin) / (ymax - ymin) * H;

  let sx = niceStep((xmax - xmin) / Math.max(4, W/40));
  let sy = niceStep((ymax - ymin) / Math.max(4, H/36));
  if ($("optEqual").checked) sx = sy = Math.max(sx, sy);

  // Gitter
  ctx.lineWidth = 1; ctx.strokeStyle = C.grid;
  ctx.beginPath();
  for (let gx = Math.ceil(xmin/sx)*sx; gx <= xmax + 1e-9; gx += sx){ const px = Math.round(X(gx))+.5; ctx.moveTo(px,0); ctx.lineTo(px,H); }
  for (let gy = Math.ceil(ymin/sy)*sy; gy <= ymax + 1e-9; gy += sy){ const py = Math.round(Y(gy))+.5; ctx.moveTo(0,py); ctx.lineTo(W,py); }
  ctx.stroke();

  // Achsen
  const ax = Math.round(Math.min(Math.max(Y(0), 0), H)) + .5;
  const ay = Math.round(Math.min(Math.max(X(0), 0), W)) + .5;
  ctx.strokeStyle = C.axis; ctx.fillStyle = C.axis; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(0,ax); ctx.lineTo(W,ax); ctx.moveTo(ay,0); ctx.lineTo(ay,H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W,ax); ctx.lineTo(W-8,ax-4); ctx.lineTo(W-8,ax+4); ctx.fill();
  ctx.beginPath(); ctx.moveTo(ay,0); ctx.lineTo(ay-4,8); ctx.lineTo(ay+4,8); ctx.fill();
  ctx.font = `600 13px ${FONT}`;
  ctx.textAlign = "right"; ctx.textBaseline = "top"; ctx.fillText("x", W-6, ax+7);
  ctx.textAlign = "left"; ctx.textBaseline = "top"; ctx.fillText("y", ay+8, 4);

  // Beschriftung
  ctx.font = `500 11.5px ${FONT}`; ctx.fillStyle = C.label; ctx.strokeStyle = C.axis; ctx.lineWidth = 1;
  const dg = Math.max(0, -Math.floor(Math.log10(sx)));
  const below = ax <= H - 18;
  ctx.textAlign = "center"; ctx.textBaseline = below ? "top" : "bottom";
  for (let gx = Math.ceil(xmin/sx)*sx; gx <= xmax + 1e-9; gx += sx){
    if (Math.abs(gx) < sx/2) continue;
    const px = X(gx); if (px < 10 || px > W - 16) continue;
    ctx.beginPath(); ctx.moveTo(px, ax-3); ctx.lineTo(px, ax+3); ctx.stroke();
    ctx.fillText(fmt(gx, dg+1), px, below ? ax + 6 : ax - 6);
  }
  const dgy = Math.max(0, -Math.floor(Math.log10(sy)));
  const leftSide = ay > W - 40;
  ctx.textAlign = leftSide ? "right" : "left"; ctx.textBaseline = "middle";
  for (let gy = Math.ceil(ymin/sy)*sy; gy <= ymax + 1e-9; gy += sy){
    if (Math.abs(gy) < sy/2) continue;
    const py = Y(gy); if (py < 16 || py > H - 8) continue;
    ctx.beginPath(); ctx.moveTo(ay-3, py); ctx.lineTo(ay+3, py); ctx.stroke();
    ctx.fillText(fmt(gy, dgy+1), leftSide ? ay - 7 : ay + 7, py);
  }
  if (xmin < 0 && xmax > 0 && ymin < 0 && ymax > 0){
    ctx.textAlign = "right"; ctx.textBaseline = "top"; ctx.fillText("0", ay - 5, ax + 5);
  }

  // Graph
  if ($("optGraph").checked && state.fn){
    ctx.save();
    ctx.strokeStyle = C.curve; ctx.globalAlpha = .85; ctx.lineWidth = 2.5; ctx.lineJoin = "round"; ctx.beginPath();
    let pen = false, prev = 0;
    for (let px = 0; px <= W; px += 0.5){
      const x = xmin + px / W * (xmax - xmin);
      const y = state.fn(x), py = Y(y);
      if (!isFinite(y) || Math.abs(py) > 1e5){ pen = false; continue; }
      if (pen && Math.abs(py - prev) > H * 1.5){ pen = false; }
      pen ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      pen = true; prev = py;
    }
    ctx.stroke();
    ctx.restore();
  }

  // Hilfslinien zum hervorgehobenen Punkt
  const hp = state.points.find(p => p.x === state.hoverX);
  if (hp){
    const px = X(hp.x), py = Y(hp.y);
    ctx.save(); ctx.setLineDash([5,4]); ctx.lineWidth = 1.5;
    ctx.strokeStyle = C.x; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, ax); ctx.stroke();
    ctx.strokeStyle = C.y; ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(ay, py); ctx.stroke();
    ctx.restore();
    ctx.font = `600 12px ${FONT}`;
    tag(fmt(hp.x), px, below ? ax + 20 : ax - 20, C.x, "center");
    tag(fmt(hp.y), leftSide ? ay - 8 : ay + 8, py, C.y, leftSide ? "right" : "left");
  }

  // Punkte
  const labels = $("optLabels").checked;
  for (const p of state.points){
    const px = X(p.x), py = Y(p.y);
    if (px < -10 || px > W + 10 || py < -10 || py > H + 10) continue;
    const hot = p.x === state.hoverX, isNew = p.x === state.lastX;
    if (hot || isNew){
      ctx.beginPath(); ctx.arc(px, py, hot ? 12 : 10, 0, Math.PI*2);
      ctx.fillStyle = "rgba(37,99,235,.16)"; ctx.fill();
    }
    ctx.beginPath(); ctx.arc(px, py, hot ? 6.5 : 5.5, 0, Math.PI*2);
    ctx.fillStyle = C.curve; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = "#fff"; ctx.stroke();
    if (labels || hot) pointLabel(p, px, py, W);
  }

  function tag(text, x, y, color, align){
    ctx.textAlign = align; ctx.textBaseline = "middle";
    const w = ctx.measureText(text).width, x0 = align === "center" ? x - w/2 : align === "right" ? x - w : x;
    ctx.fillStyle = "#fff"; ctx.fillRect(x0 - 4, y - 9, w + 8, 18);
    ctx.fillStyle = color; ctx.fillText(text, x, y);
  }
  function pointLabel(p, px, py, W){
    ctx.font = `600 12px ${FONT}`; ctx.textBaseline = "alphabetic"; ctx.textAlign = "left";
    const parts = [["(", C.label], [fmt(p.x,2), C.x], [" | ", C.label], [fmt(p.y,2), C.y], [")", C.label]];
    const tw = parts.reduce((s, [t]) => s + ctx.measureText(t).width, 0);
    let tx = px + 9, ty = py - 9;
    if (tx + tw > W - 4) tx = px - 9 - tw;
    if (ty < 14) ty = py + 20;
    ctx.fillStyle = "rgba(255,255,255,.88)";
    ctx.fillRect(tx - 3, ty - 13, tw + 6, 17);
    for (const [t, c] of parts){ ctx.fillStyle = c; ctx.fillText(t, tx, ty); tx += ctx.measureText(t).width; }
  }
}

/* ---------- Zoomen & Verschieben ---------- */
function setViewFromEff(v){ state.view = v; syncRangeInputs(); draw(); }
function zoomAt(f, px, py){
  const W = canvas.clientWidth, H = canvas.clientHeight, v = effView(W, H);
  const cx = v.xmin + px / W * (v.xmax - v.xmin), cy = v.ymax - py / H * (v.ymax - v.ymin);
  const w = (v.xmax - v.xmin) * f, h = (v.ymax - v.ymin) * f;
  if (w < 1e-3 || h < 1e-3 || w > 1e6 || h > 1e6) return;
  setViewFromEff({ xmin: cx - (cx - v.xmin) * f, xmax: cx + (v.xmax - cx) * f,
                   ymin: cy - (cy - v.ymin) * f, ymax: cy + (v.ymax - cy) * f });
}
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  zoomAt(Math.exp(e.deltaY * (e.deltaMode === 1 ? 0.05 : 0.0015)), e.clientX - r.left, e.clientY - r.top);
}, { passive:false });
$("zoomIn").addEventListener("click", () => zoomAt(1/1.4, canvas.clientWidth/2, canvas.clientHeight/2));
$("zoomOut").addEventListener("click", () => zoomAt(1.4, canvas.clientWidth/2, canvas.clientHeight/2));
$("zoomHome").addEventListener("click", () => { state.view = {...STD_VIEW}; syncRangeInputs(); draw(); });

const pointers = new Map();
let pinchDist = 0;
canvas.addEventListener("pointerdown", e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  canvas.classList.add("dragging");
  if (pointers.size === 2){ const [a,b] = [...pointers.values()]; pinchDist = Math.hypot(a.x-b.x, a.y-b.y); }
});
canvas.addEventListener("pointermove", e => {
  const r = canvas.getBoundingClientRect(), W = r.width, H = r.height, v = effView(W, H);
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const x = v.xmin + mx / W * (v.xmax - v.xmin), y = v.ymax - my / H * (v.ymax - v.ymin);
  const c = $("coord"); c.hidden = false; c.textContent = `x = ${fmt(x,2)}   y = ${fmt(y,2)}`;

  if (!pointers.has(e.pointerId)){
    // Punkt unter der Maus hervorheben
    let best = null, bd = 12;
    for (const p of state.points){
      const d = Math.hypot((p.x - v.xmin) / (v.xmax - v.xmin) * W - mx, H - (p.y - v.ymin) / (v.ymax - v.ymin) * H - my);
      if (d < bd){ bd = d; best = p.x; }
    }
    setHover(best);
    return;
  }
  const prev = pointers.get(e.pointerId);
  if (pointers.size === 1){
    const dx = (e.clientX - prev.x) / W * (v.xmax - v.xmin), dy = (e.clientY - prev.y) / H * (v.ymax - v.ymin);
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    setViewFromEff({ xmin:v.xmin - dx, xmax:v.xmax - dx, ymin:v.ymin + dy, ymax:v.ymax + dy });
  } else if (pointers.size === 2){
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    const [a,b] = [...pointers.values()], d = Math.hypot(a.x-b.x, a.y-b.y);
    if (pinchDist > 0 && d > 0) zoomAt(pinchDist / d, (a.x+b.x)/2 - r.left, (a.y+b.y)/2 - r.top);
    pinchDist = d;
  }
});
const endPointer = e => { pointers.delete(e.pointerId); pinchDist = 0; if (!pointers.size) canvas.classList.remove("dragging"); };
canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", endPointer);
canvas.addEventListener("pointerleave", () => { $("coord").hidden = true; setHover(null); });

new ResizeObserver(draw).observe(canvas);

/* ---------- Start ---------- */
function init(){
  syncRangeInputs();
  setHidden(state.hidden);
  setSyntax(state.syntax);
  applyFn(true);
  renderTable();
  draw();
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
else init();
window.addEventListener("load", () => { checkFn(); draw(); });
document.fonts && document.fonts.ready.then(draw);
})();
</script>
</body>
</html>
